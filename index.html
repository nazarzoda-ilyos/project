<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мое PWA</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PWA Manifest & iOS meta tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Приложение">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between items-center p-4">

  <!-- Шапка (Header) -->
  <header class="w-full max-w-md pt-4 pb-2 border-b border-slate-800 flex justify-between items-center">
    <h1 class="text-xl font-bold text-indigo-400">My App</h1>
    <span class="text-xs bg-indigo-950 text-indigo-300 px-2 py-1 rounded-full border border-indigo-800">iOS Ready</span>
  </header>

  <!-- Основной контент -->
  <main class="w-full max-w-md bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700 text-center my-auto">
    <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/30">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
      </svg>
    </div>
    <h2 class="text-2xl font-bold mb-2">Привет из PWA!</h2>
    <p class="text-slate-400 text-sm mb-6">Это интерфейс твоего приложения на Tailwind CSS.</p>

    <button onclick="alert('Всё работает!')" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-semibold rounded-xl transition shadow-lg shadow-indigo-600/30">
      Нажми меня
    </button>
  </main>

  <!-- Нижнее меню (TabBar) -->
  <nav class="w-full max-w-md bg-slate-800/80 backdrop-blur-md rounded-2xl p-3 border border-slate-700 flex justify-around">
    <button class="text-indigo-400 font-medium text-xs flex flex-col items-center">
      <span>🏠</span> Главная
    </button>
    <button class="text-slate-400 font-medium text-xs flex flex-col items-center">
      <span>⚙️</span> Настройки
    </button>
  </nav>

  <!-- Регистрация Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(() => console.log('Service Worker готов!'))
        .catch((err) => console.log('Ошибка SW:', err));
    }
  </script>
</body>
</html>
